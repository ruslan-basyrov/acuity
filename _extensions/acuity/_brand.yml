meta:
  name: Acuity
typography:
  # Font with improved legibility and readability (https://www.brailleinstitute.org/freefont/)
  fonts:
    - family: EB Garamond
      source: google
    - family: JetBrains Mono
      source: google
    - family: Atkinson Hyperlegible Next
      source: google
    - family: Roboto
      source: google
  base: Atkinson Hyperlegible Next
  monospace: JetBrains Mono
  headings:
    family: EB Garamond

# Paul Tol's color palette for colour-blind people (https://sronpersonalpages.nl/~pault/)
color:
  palette:
    rose: "#CC6677"
    blue: "#332288"
    sand: "#DDCC77"
    green: "#117733"
    cyan: "#88CCEE"
    wine: "#882255"
    teal: "#44AA99"
    olive: "#999933"
    purple: "#AA4499"
    gray: "#DDDDDD"
    black: "#00000F"
    white: "#FAFCFD"
  primary:
    light: "#a8431b"
    dark: "#c9623a"
  secondary:
    light: "#52525B" 
    dark: "#A1A1AA"  
  tertiary:
    light: "#8B8D8E" 
    dark: "#71717A"  
  success: green
  info: cyan
  warning: sand
  danger: wine
  # used for navigation
  light:
    light: white
    dark: black
  dark:
    light: black
    dark: white 
  # font color
  foreground:
    light: "#1C1B1B" 
    dark: "#EEEEEE"  
  # background color
  background:
    light: white
    dark: black

# Quarto derives callout colors from Bootstrap's $blue/$green/$yellow/$red,
# not from the semantic roles above. Point them back at the brand.
defaults:
  bootstrap:
    defaults:
      callout-color-note: "$info"
      callout-color-tip: "$success"
      callout-color-warning: "$warning"
      callout-color-important: "$danger"
