meta:
  name: Acuity
typography:
  # Font with improved legibility and readability (https://www.brailleinstitute.org/freefont/)
  fonts:
    - family: JetBrains Mono
      source: google
    - family: Atkinson Hyperlegible Next
      source: google
      weight: [400, 700]
      style: [normal, italic]
  base: Atkinson Hyperlegible Next
  monospace: JetBrains Mono
  headings:
    family: Atkinson Hyperlegible Next
  monospace-block:
    background-color:
      light: "#F4F4F5"
      dark: "#18181B"

# Paul Tol's color palette for colour-blind people (https://sronpersonalpages.nl/~pault/)
color:
  palette:
    rose: "#CC6677"
    blue: "#332288"
    sand: "#DDCC77"
    green: "#117733"
    cyan: "#88CCEE"
    wine: "#882255"
    teal: "#44AA99"
    olive: "#999933"
    purple: "#AA4499"
    gray: "#DDDDDD"
    black: "#00000F"
    white: "#FAFCFD"
  primary:
    light: "#a8431b"
    dark: "#c9623a"
  success: green
  info: cyan
  warning: sand
  danger: wine
  # used for navigation
  light:
    light: white
    dark: black
  dark:
    light: black
    dark: white
  # font color
  foreground:
    light: "#1C1B1B"
    dark: "#EEEEEE"
  # background color
  background:
    light: white
    dark: black

# Match Typst's native callout roles in HTML as well.
defaults:
  bootstrap:
    defaults:
      callout-color-note: "$primary"
      callout-color-tip: "$success"
      callout-color-warning: "$warning"
      callout-color-important: "$danger"
