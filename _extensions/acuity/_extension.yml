title: Acuity
author: Ruslan Basyrov
version: 0.1.2
quarto-required: ">=1.8.0"
contributes:
  # This doesn't with `website` project,
  # so the file must be move to the root of the project
  # brand: _brand.yml
  project:
    project:
      type:  website
      output-dir: _acuity
      brand: _brand.yml
      pre-render:
        - ../acuity-figures/prerender.ts
    website:
      navbar:
        background: light
        search: true
        style: floating
        collapsible: true

  formats:
    html:
      filters:
        - at: pre-ast
          path: wideblock.lua
        - captions.lua
        - citations.lua
        - sideblock.lua
      grid:
        sidebar-width: 0px
        body-width: 700px
        margin-width: 400px
        # gutter-width: 1.5rem
      include-after-body:
        # Restore the number link for side notes.
        - sidenote.html
        - margin.html
        - peektoc.html
      # code-block-border-left: true
      toc: true
      toc-title: "Contents"
      toc-location: body
      page-layout: article
      # The same region as the Typst side, so both formats quote titles alike.
      lang: en-GB
      reference-links: true
      # `^[...]` becomes a margin note, matching the `#show footnote` rule on the
      # Typst side.
      reference-location: margin
      cite-method: citeproc
      csl: ieee.csl
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand, custom.scss]
        dark: [brand, custom.scss]

    typst:
      filters:
        - at: pre-ast
          path: wideblock.lua
        - captions.lua
        - citations.lua
        - sideblock.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
      cite-method: citeproc
      syntax-highlighting: idiomatic
      theme:
        - brand
      # Quarto's own `csl:` breaks the Typst writer
      # (https://github.com/quarto-dev/quarto-cli/issues/11552), so the style is
      # named here and citations.lua hands it to the template. Drop this key and
      # Typst falls back to its own default style.
      typst-csl: ieee.csl
      # citation-location is intentionally NOT set: citations.lua generates
      # margin notes itself; letting Quarto do it too creates nested #note()
      # inside #footnote[] which breaks Typst's citation introspection.
