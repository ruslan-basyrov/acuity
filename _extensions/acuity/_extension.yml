title: Acuity
author: Ruslan Basyrov
version: 0.0.13
quarto-required: ">=1.8.0"
contributes:
  # This doesn't with `website` project,
  # so the file must be move to the root of the project
  # brand: _brand.yml
  project:
    project:
      type:  website
      output-dir: _acuity
      brand: _brand.yml
      pre-render:
        - ../acuity-figures/prerender.ts
    website:
      navbar:
        background: light
        search: true
        style: floating
        collapsible: true

  formats:
    html:
      filters:
        - at: pre-ast
          path: wideblock.lua
        - citations.lua
        - sideblock.lua
      grid:
        sidebar-width: 0px
        body-width: 700px
        margin-width: 400px
        # gutter-width: 1.5rem
      # code-block-border-left: true
      toc: true
      toc-title: "Contents"
      toc-location: body
      page-layout: article
      # Matches the Typst side's region, so both formats quote titles the same way.
      lang: en-GB
      reference-links: true
      # citations.lua puts the short reference in the margin, so citeproc is left
      # to render the full bibliography at the end, exactly as the PDF does.
      reference-location: document
      cite-method: citeproc
      csl: ieee.csl
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand, custom.scss]
        dark: [brand, custom.scss]

    typst:
      filters:
        - at: pre-ast
          path: wideblock.lua
        - citations.lua
        - sideblock.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
      cite-method: citeproc
      syntax-highlighting: idiomatic
      theme:
        - brand
      # The CSL file is hardcoded in `typst-template.typ`
      # until this issue is resolved: https://github.com/quarto-dev/quarto-cli/issues/11552
      # csl: custom.csl
      # citation-location is intentionally NOT set: citations.lua generates
      # margin notes itself; letting Quarto do it too creates nested #note()
      # inside #footnote[] which breaks Typst's citation introspection.
