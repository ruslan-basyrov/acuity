title: Acuity
author: Ruslan Basyrov
version: 0.0.13
quarto-required: ">=1.8.0"
contributes:
  # This doesn't with `website` project,
  # so the file must be move to the root of the project
  # brand: _brand.yml
  project:
    project:
      type:  website
      output-dir: _acuity
      brand: _brand.yml
    website:
      navbar:
        background: light
        search: true
        style: floating
        collapsible: true

  formats:
    html:
      filters:               
        - wideblock.lua
      grid:
        sidebar-width: 0px
        body-width: 700px
        margin-width: 400px
        # gutter-width: 1.5rem
      # code-block-border-left: true
      toc: true
      toc-title: "Contents"
      toc-location: body
      page-layout: article
      reference-links: true
      reference-location: margin
      citation-location: margin
      cite-method: citeproc
      csl: custom.csl
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand, custom.scss]
        dark: [brand, custom.scss]

    typst:
      filters:
        - wideblock.lua
        # - sideblock.lua
      template-partials:
        - typst-template.typ
        - typst-show.typ
      syntax-highlighting: idiomatic
      theme:
        - brand
      # The CSL file is hardcoded in `typst-template.typ`
      # until this issue is resolved: https://github.com/quarto-dev/quarto-cli/issues/11552
      # csl: custom.csl
