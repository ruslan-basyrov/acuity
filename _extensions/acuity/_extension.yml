title: Acuity
author: Ruslan Basyrov
version: 0.2.0
quarto-required: ">=1.8.0"
contributes:
  project:
    project:
      type: website
      output-dir: _acuity
      brand: _brand.yml

  formats:
    common:
      # HTML grid in pixels; PDF scales the same proportions to the paper.
      grid:
        body-width: 700px
        margin-width: 400px
        gutter-width: 75px
      acuity:
        # Notes, captions, the text of figures and their legends.
        small: 0.8em
        figures:
          aspect-ratio: 2.4
          min-height: 10em
          legend-width: 12em
      # filters:
      #   - acuity.lua
      cite-method: citeproc
      lang: en-GB
      citeproc: true

    html:
      fontsize: 17px
      grid:
        sidebar-width: 0px
      toc: true
      toc-title: "Contents"
      toc-location: body
      page-layout: article
      reference-links: true
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand]
        dark: [brand]

    typst:
      fontsize: 10pt
      papersize: a4
      # The edges of the paper; the margin column sits inside the right one.
      margin:
        left: 25mm
        right: 15mm
        top: 25mm
        bottom: 25mm
      syntax-highlighting: idiomatic
      theme: [brand]
