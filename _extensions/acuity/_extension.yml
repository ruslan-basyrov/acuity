title: Acuity
author: Ruslan Basyrov
version: 0.2.0
quarto-required: ">=1.9.0"
contributes:
  project:
    project:
      type: website
      output-dir: _acuity
      brand: _brand.yml

  formats:
    common:
      fig-cap-location: margin
      cite-method: citeproc
      lang: en-GB
      citeproc: true
      knitr:
        opts_chunk:
          out.width: "100%"

    html:
      fontsize: 16px
      grid:
        body-width: 700px
        margin-width: 400px
        sidebar-width: 0px
      toc: true
      toc-title: "Contents"
      toc-location: body
      # The PDF link lives in the navbar instead (see _quarto.yml).
      format-links: false
      page-layout: article
      reference-links: true
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand]
        dark: [brand]

    typst:
      fontsize: 10pt
      papersize: a4
      margin:
        top: 25mm
        bottom: 25mm
      margin-geometry:
        inner: {far: 20mm, width: 0mm, separation: 0mm}
        outer: {far: 20mm, width: 60mm, separation: 8mm}
      syntax-highlighting: idiomatic
      theme: [brand]
