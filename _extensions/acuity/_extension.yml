title: Acuity
author: Ruslan Basyrov
version: 0.2.0
quarto-required: ">=1.8.0"
contributes:
  # This doesn't with `website` project,
  # so the file must be move to the root of the project
  # brand: _brand.yml
  project:
    project:
      type:  website
      output-dir: _acuity
      brand: _brand.yml
    website:
      navbar:
        background: light
        search: true
        style: floating
        collapsible: true

  formats:
    common:
      cite-method: citeproc

    html:
      grid:
        sidebar-width: 0px
        body-width: 700px
        margin-width: 400px
        # gutter-width: 1.5rem
      # code-block-border-left: true
      toc: true
      toc-title: "Contents"
      toc-location: body
      page-layout: article
      lang: en-GB
      reference-links: true
      # `^[...]` becomes a margin note.
      reference-location: margin
      syntax-highlighting: github
      respect-user-color-scheme: true
      theme:
        light: [brand]
        dark: [brand]

    typst:
      syntax-highlighting: idiomatic
      theme:
        - brand
